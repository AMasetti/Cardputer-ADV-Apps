; M5Stack Cardputer-Adv + RA-02 (SX1278 433 MHz)
; build.sh copia esta carpeta a variants/esp32s3/m5stack_cardputer_adv_ra02
; dentro del firmware upstream y compila este env.
[env:m5stack-cardputer-adv-ra02]
extends = esp32s3_base
board = m5stack-stamps3
board_build.partitions = default_8MB.csv
upload_protocol = esptool
build_flags =
  ${esp32s3_base.build_flags}
  -D M5STACK_CARDPUTER_ADV
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -I variants/esp32s3/m5stack_cardputer_adv_ra02
  -DOLEDDISPLAY_REDUCE_MEMORY
lib_deps =
  ${esp32s3_base.lib_deps}
  https://github.com/meshtastic/st7789/archive/92bae2e4a307afb430c3b0bc3d661c55ee1565f0.zip
  https://github.com/pschatzmann/arduino-audio-driver/archive/v0.3.1.zip
  https://github.com/meshtastic/ESP8266Audio/archive/343024632ee78d6216907b2353fc943a62422d80.zip
  earlephilhower/ESP8266SAM@1.1.0
